{% extends 'base.html' %}{% block title %}Añadir producto · GestorTech{% endblock %}{% block content %}<section class="page-heading"><div><p class="eyebrow">Inventario</p><h1>Añadir producto</h1></div></section><form class="form-panel narrow" method="post" enctype="multipart/form-data" aria-describedby="form-feedback"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><label for="name">Nombre</label><input id="name" name="name" maxlength="160" required value="{{ request.form.get('name','') }}"><label for="description">Descripción</label><textarea id="description" name="description" rows="3" maxlength="2000">{{ request.form.get('description','') }}</textarea><label for="category">Categoría</label><input id="category" name="category" maxlength="100" value="{{ request.form.get('category','') }}"><label for="price">Precio (COP)</label><input id="price" name="price" type="number" min="0" step="0.01" required value="{{ request.form.get('price','') }}"><label for="stock">Cantidad inicial</label><input id="stock" name="stock" type="number" min="0" step="1" value="{{ request.form.get('stock','0') }}" required>{% include 'product_media_fields.html' %}<div class="form-actions"><a class="button quiet" href="{{ url_for('web.products') }}">Cancelar</a><button class="button primary" type="submit">Guardar producto</button></div></form>{% endblock %}
